<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Book — Concordia Week</title>
<style>
  :root{
    --ink:#101c26; --ink-2:#425561; --ink-3:#7d8f9b;
    --bg:#eef1f4; --card:#fff; --panel:#122431;
    --rule:#d3dbe1; --rule-2:#e7ecf0;
    --seal:#8a2432;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --accent:#2f6b58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5}
  a{color:#1d5480;text-decoration:none;border-bottom:1px solid rgba(29,84,128,.3)}
  a:hover{color:var(--seal);border-bottom-color:rgba(138,36,50,.4)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px 70px}

  .bar{background:var(--seal);color:#fff;font-size:12px;padding:6px 18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .top{background:var(--panel);color:#e9eff4;padding:20px 18px 18px}
  .top-in{max-width:904px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .top h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em;line-height:1}
  .top p{margin:5px 0 0;font-size:13.5px;color:#90b0c6}
  .btn{font:500 12.5px var(--sans);background:rgba(255,255,255,.1);color:#e9eff4;border:1px solid rgba(255,255,255,.22);border-radius:3px;padding:6px 11px;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.18)}

  .dayhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
  .dayhead h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0}
  .dayhead span{font-size:12.5px;color:var(--ink-3)}
  .card{
    background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);
    display:grid;grid-template-columns:52px 76px 1fr auto;gap:14px;align-items:center;
    padding:14px 16px;margin:0 0 8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
  }
  .card:hover{background:#f7fafb;border-color:var(--ink-3)}
  .mono{
    width:52px;height:52px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    font:600 15px var(--sans);letter-spacing:.02em;color:#fff;background:var(--accent);flex:0 0 auto;
  }
  .card .tm{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.3}
  .card h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 2px;line-height:1.2}
  .card .sub{font-size:13px;color:var(--ink-2);margin:0}
  .card .go{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
  @media(max-width:620px){
    .card{grid-template-columns:44px 1fr;gap:12px}
    .mono{width:44px;height:44px;font-size:13px}
    .card .tm{grid-column:2}
    .card .body{grid-column:2}
    .card .go{display:none}
  }
  .slot{background:var(--card);border:1px dashed var(--rule);padding:14px 16px;margin:0 0 8px;font-size:13.5px;color:var(--ink-3)}

  .back{background:none;border:0;font:500 13px var(--sans);color:var(--ink-2);cursor:pointer;padding:18px 0 10px}
  .back:hover{color:var(--seal)}
  .mhead{display:flex;gap:16px;align-items:center;padding:0 0 16px;border-bottom:2px solid var(--accent)}
  .mhead .mono{width:60px;height:60px;font-size:17px}
  .mhead h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 3px;line-height:1.05;letter-spacing:-.015em}
  .mhead p{margin:0;font-size:13.5px;color:var(--ink-2)}

  .tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--bg);position:sticky;top:0;z-index:5;padding:10px 0 0;border-bottom:1px solid var(--rule)}
  .tab{
    font:500 13px var(--sans);background:transparent;border:1px solid transparent;border-bottom:0;
    color:var(--ink-2);padding:8px 14px;cursor:pointer;border-radius:3px 3px 0 0;margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--card);border-color:var(--rule);color:var(--ink);font-weight:600}
  .pane{background:var(--card);border:1px solid var(--rule);border-top:0;padding:22px 20px 24px}

  h4.sec{font:600 12px var(--sans);color:var(--ink-3);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule-2)}
  h4.sec:first-child{margin-top:0}
  p{margin:0 0 10px;max-width:70ch}
  .lede{font-family:var(--serif);font-size:16.5px;line-height:1.45;color:var(--ink-2);max-width:62ch;margin:0 0 4px}
  ul{margin:0 0 10px;padding-left:19px;max-width:70ch}
  li{margin:0 0 6px}

  .facts{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:0 0 4px}
  @media(min-width:560px){.facts{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
  .facts div{background:#f8fafb;padding:9px 12px}
  .facts dt{font:600 10.5px var(--sans);color:var(--ink-3);margin:0 0 2px}
  .facts dd{margin:0;font-size:13.5px;line-height:1.35}

  .stats{display:grid;gap:10px;margin:0 0 12px}
  @media(min-width:560px){.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
  .stat{border:1px solid var(--rule);background:#f8fafb;padding:12px 13px}
  .stat b{display:block;font-family:var(--serif);font-size:25px;font-weight:400;line-height:1.05;color:var(--accent)}
  .stat span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.3}
  .stat em{display:block;font-style:normal;font-size:11px;color:var(--ink-3);margin-top:4px}

  .person{display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}
  .person .mono{width:46px;height:46px;font-size:14px;background:var(--ink-2)}
  .person h5{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 1px;line-height:1.2}
  .person .role{font-size:12.5px;color:var(--accent);margin:0}
  .roster{display:grid;gap:8px;margin:0 0 10px}
  @media(min-width:620px){.roster{grid-template-columns:1fr 1fr}}
  .rost{border:1px solid var(--rule-2);padding:9px 11px;font-size:13.5px}
  .rost b{display:block;font-weight:600}
  .rost span{color:var(--ink-2);font-size:12.5px}

  .tl{list-style:none;margin:0 0 10px;padding:0 0 0 2px;max-width:70ch}
  .tl li{position:relative;padding:0 0 15px 22px;border-left:1px solid var(--rule);margin:0}
  .tl li:last-child{border-left-color:transparent;padding-bottom:0}
  .tl li::before{content:"";position:absolute;left:-4.5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .tl .yr{font:600 11.5px var(--sans);color:var(--ink-3);display:block;margin-bottom:1px}
  .tl .ev{font-size:14px;display:block}

  .links{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--rule-2);border:1px solid var(--rule-2)}
  .links li{margin:0;background:#fff}
  .links a{display:block;padding:9px 12px;font-size:13.5px;border:0}
  .links a:hover{background:#f6f9fb}
  .links .h{font-size:12.5px;color:var(--ink-3);display:block}

  .memo{border:1px solid var(--rule);background:#f8fafb;margin:0 0 12px}
  .memo>summary{cursor:pointer;list-style:none;padding:10px 13px;font-size:13.5px;color:#1d5480;font-weight:500}
  .memo>summary::-webkit-details-marker{display:none}
  .memo>summary:hover{color:var(--seal)}
  .memo .m{padding:2px 15px 14px;border-top:1px solid var(--rule)}
  .memo .m p{font-size:13.5px;max-width:66ch;color:var(--ink-2)}
  .memo .m .meta{font-size:11.5px;color:var(--ink-3);margin:10px 0 8px}
  .memo .exact{
    white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--ink);background:#fff;border:1px solid var(--rule);padding:13px 14px;
    margin:8px 0 0;max-width:none;overflow-x:auto;
  }

  .doc{border:1px solid var(--rule);margin:0 0 10px}
  .doc .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;background:#f8fafb;border-bottom:1px solid var(--rule);font-size:13px;flex-wrap:wrap}
  .doc iframe{display:block;width:100%;height:580px;border:0;background:#f2f4f6}
  @media(max-width:620px){.doc iframe{height:400px}}

  .idea{border-left:3px solid var(--rule);padding:0 0 0 13px;margin:0 0 15px}
  .idea.p1{border-left-color:var(--accent)}
  .idea h5{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 3px;line-height:1.2}
  .idea p{font-size:14px;margin:0 0 5px;max-width:68ch}
  .idea .q{font-size:13px;color:var(--ink-2);margin:0}

  .hide{display:none}
  footer{margin:24px 0 0;font-size:12px;color:var(--ink-3)}

  @media print{
    body{background:#fff}
    .bar,.tabs,.back{display:none!important}
    .top{background:#fff;color:#000;padding:0 0 10px}
    .top h1,.top p{color:#000}
    .pane{border:0;padding:0}
    .doc iframe{display:none}
  }
</style>
</head>

  history:{

    timeline:[
      ["2025","<b>Kettering Foundation \u2014 Democracy for All.</b> Nationally representative survey of 20,338 U.S. adults, fielded July to August 2025 by web and mail, \u00b10.9 points. Gallup Panel recruited 9,157 respondents, supplemented by 11,181 from a third-party provider."],
      ["Jun 2026","<b>Podcaster and influencer audiences</b> \u2014 roughly 1,000 respondents named a podcaster or influencer among their top news sources. Left-leaning audiences strongly agree with the right to peaceful protest at 71% against 49% of Democrats; right-leaning audiences at 40% against 28% of Republicans. Only 8% of left-leaning audiences believe leaders will be held accountable, against 26% of Democrats. MeidasTouch listeners rate voting very effective at 64%, Joe Rogan listeners at 37%. Co-authored by Chris Miljanich and Justin Lall."],
      ["Jun 2026","<b>Platform-level civic attitudes</b> \u2014 pro-democratic attitudes vary systematically by platform, and the differences persist after controlling for demographics and party. X and Snapchat users most positive; Reddit users most sceptical; Instagram users indistinguishable from non-users. Reported as associations, not causation. By Ellyn Maese."],
      ["2026","<b>USC Annenberg, TIME, McKinsey and Gallup \u2014 Trust in Media Initiative established.</b> A three-year programme built as a continuous system of record on trust in media, rather than a one-off study. USC Annenberg anchors the academic framing, Gallup designs and fields the research, TIME amplifies, McKinsey translates findings for industry."],
      ["in field now","<b>Underway.</b> Semiannual surveys of 3,500 U.S. adults on the Gallup Panel, with a stable core module for long-term tracking and rotating content on emerging issues. Early findings are already publishing, including the finding that use of AI to get news remains rare."],
      ["Jan 2027","<b>First wave launches</b>, with releases every six months thereafter tracking broad trust in media \u2014 trust in news and information, accuracy and fairness, transparency of sourcing, independence from political influence, civic knowledge, and news consumption and avoidance."]

    note:"Both programmes are Gallup's own and both are live. Between them they cover democratic attitudes at scale, platform and audience differences, and a continuous measure of media trust. They are the credential for a wider conversation about Emerson's portfolio \u2014 not the thing being sold.",
    docs:[{label:"Trust in Media Initiative \u2014 originating proposal, internal", url:"https://global.gallupproposals.com/USC2026.pdf"}],
    sections:[
      {h:"Early data already public", ul:[
        "<b>Use of AI to Get News in U.S. Is Rare</b>, June 2026. Just <b>7%</b> of Americans rely a great deal or a fair amount on AI tools for news, and only <b>2%</b> name an AI chatbot or assistant among their top three news sources \u2014 level with messaging apps, and behind print newspapers at 8%, podcasts at 13%, search engines at 16% and radio at 17%. A useful corrective to the assumption that AI has already displaced conventional sources.",
        "The same study found <b>39%</b> say any use of AI in news reporting would reduce their trust outright, rising to 43% among 18- to 49-year-olds. Of the things that would increase trust, verifying against another source (22%) and a human editor checking the work (20%) both beat clear disclosure that AI was used (7%).",
        "<b>Social Media Use Linked to Mixed Views on Democracy</b>, March 2026. Heavy users are more confident that citizens' voices matter and that protest, campaigning and town halls work \u2014 yet only <b>57%</b> of heavy users agree democracy is the best form of government, against <b>over 70%</b> of those using social media an hour or less a day. The pattern holds within both parties and is widest among independents.",
        "<b>Youth, Loneliness and Political Violence in the U.S.</b>, December 2025. <b>16%</b> of Americans say it is sometimes OK to use violence to achieve a political goal. Age is the strongest predictor and loneliness compounds it: <b>45%</b> of men aged 18 to 29 who always or often feel lonely say political violence is sometimes acceptable, against 25% of women the same age who feel lonely and 32% of men aged 30 to 44 who do.",
        "<b>Free Time Does Not Predict Americans' Community Involvement</b>, April 2026. Roughly a quarter of Americans have reasonable free time and want to volunteer but do not. Work and family obligations are cited at almost the same rate by volunteers (45%) and non-volunteers (46%), so time is not the differentiator. What separates them is that <b>54%</b> of would-be volunteers are unsure how to get involved, against 35% of those who have volunteered, and <b>51%</b> say nobody invited or encouraged them."
      ]},
      {h:"Trend context", ul:[
        "Trust in the mass media to report the news fully, accurately and fairly hit a new low of <b>28%</b> in Gallup's October 2025 release, against nearly three-quarters in 1976. More than one in three Americans now express no trust in the media at all.",
        "The decline is no longer only partisan: groups historically more trusting of the press, including Democrats and college-educated adults, have registered steep drops of their own.",
        "It sits inside a wider institutional picture \u2014 Gallup's average confidence across major U.S. institutions has been below 30% for five consecutive years.",
        "<b>Democracy for All is itself a five-year project</b>, and the December 2025 political violence findings came from its inaugural administration. Both programmes named in the meeting description are built as multi-year instruments rather than one-off studies."
      ]}

  ideas:[
    {p:1,t:"One outcome measure across four priorities",d:"Democracy, immigration, education and climate share no common yardstick, so portfolio-level impact cannot be stated in a single sentence. Gallup's wellbeing framework runs across all four and across borders \u2014 life evaluation, thriving and struggling, daily experience, agency. Applied consistently, it lets Emerson describe what changed in the same terms whichever programme did it.",q:"Whether portfolio-level measurement is wanted, or whether each programme prefers its own metrics."},
    {p:1,t:"Local consent and whether projects get built",d:"Local acceptance has become the binding constraint on the energy transition and on data-centre and infrastructure siting. Gallup has the community-level measurement to establish what moves a place from resistance to consent, which benefits actually register with residents, and how much of the opposition is fixed. Serves Emerson's investment side and Elemental Impact directly.",q:"Whether research that serves the investment portfolio sits in Simas's remit or elsewhere."},
    {p:0,t:"Immigration from both ends",d:"US immigration research is almost entirely about American attitudes. The World Poll measures why people leave, where they intend to go and what would keep them, across more than 140 countries. Holding both sides in one study is something very few organizations can do, and immigration is one of Emerson's founding commitments.",q:"Whether Emerson wants global framing or US-only evidence."},
    {p:0,t:"Whether the American promise still reads as true",d:"A generational and geographic measure of belief in mobility \u2014 who still thinks effort leads somewhere, where that belief has collapsed, and how it tracks against actual local conditions. Sits across the education and economic mobility work rather than inside either.",q:"Overlap with existing Gallup foundation partners in education."}

        "<b>Safety tooling.</b> Private Detector, an AI tool that detects and blurs explicit images before they reach users, open-sourced in 2022; Deception Detector, machine learning against inauthentic profiles, spam and scams; CSAM detection by hash-matching against industry databases; text-based machine learning for violating content; behavioural anti-spam systems.",
        "<b>Legislative advocacy.</b> Multi-state campaigns in the US to criminalise cyberflashing; campaigning in Brussels to keep cyberflashing and AI-enabled intimate image abuse in the EU Directive on combating violence against women; engagement with the UK Department for Science, Innovation and Technology under the Online Safety Act.",
        "<b>Civil society partners.</b> CHAYN, the End Violence Against Women Coalition and Refuge in the UK; Full Stop Australia; AWARE; a French coalition including DILCRAH and LGBTQ+ organisations, alongside law enforcement.",
        "The 10-K states that safety and advocacy are central to the brand and growth strategy, and that the company engages regulators and experts to shape safer online environments, particularly for women and underrepresented communities.",
        "Impact reporting is organised around a kinder, safer internet; healthy and equitable relationships; environmental stewardship; and governance."

    sections:[
      {h:"Where this stands", ul:[
        "<b>The hard date.</b> The 11 September note put it plainly: to hit mid-January, the project needs to be underway by the end of this month. The agreement went with it so contract review would not become the bottleneck \u2014 drafted with an effective date of 21 September and a Year 1 starting 1 October.",
        "<b>Internally, it has gone well.</b> Haifa reported a positive discussion with the president and members of the executive team, and the notes record the proposal being received as a model proposal. Raj set the standard \u2014 a primary data source people return to year over year \u2014 and the urgency: twice as big, half the time.",
        "<b>The design is settled in outline.</b> 10,000 on the Gallup probability panel for the national read, plus roughly 500 per state through a consumer panel provider for state-level actionability, two distinct report outputs, a 300-case floor for subgroup reporting, and a branched instrument covering both the employed and the non-employed.",

      {h:"The five questions Haifa set in August, and how they were answered", ul:[
        "After her team had been through the interactive concept, she sent five questions in writing and asked for a call with John Gans to work through them. They shaped everything since, and all five are now answered in the proposal.",
        "<b>1. Sample size.</b> She said 5,000 to 10,000 read as low for meaningful trend telling. Answered on reportability: the 10,000 national sample is sized so results report with confidence by worker type \u2014 full-time employed, self-employed, gig, and small- versus large-employer \u2014 and by industry, not just workers in aggregate.",
        "<b>2. Geographic cuts.</b> She was specific that the Foundation wants state-level views. Answered: 500 completed interviews in each of the 50 states on consumer panels weighted to Census benchmarks, alongside the national probability sample \u2014 every state independently reportable.",
        "<b>3. Cadence.</b> Answered: a 15-minute annual flagship instrument carrying the study, with a 3-minute quarterly tracking module on the Gallup Poll Social Series for the measures that move fast between waves.",
        "<b>4. Dashboard.</b> Answered as a Gallup-created and maintained research hub, alongside the national release series and the state action layer.",
        "<b>5. Differentiation and white space.</b> Answered directly, and it is the spine of the proposal. Kept consistent below."
      ]},
      {h:"The white space, in the proposal's own language", ul:[
        "<b>What exists:</b> adoption and macro data \u2014 robust tracking of who uses AI, how often and in which tools, plus labour-market aggregates.",
        "<b>What is missing:</b> the scope and scale. A read big enough to cover every kind of worker, the same way, year after year \u2014 not the small, one-off polls that exist today.",
        "<b>What is absent entirely:</b> a geographic lens. Where disruption lands and how it differs by region and industry \u2014 the cut no national poll provides. Every state independently reportable. <b>This is the white space.</b>",
        "The framing throughout: most AI-and-work coverage lives in two places, national aggregates and a narrow slice of often knowledge workers. What is missing is nuance \u2014 which workers, where, and how they actually feel.",

/* ---------- helpers ---------- */

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function el(id){return document.getElementById(id);}

function statTiles(a){
  if(!a||!a.length) return "";
  return '<div class="stats">'+a.map(function(s){
    return '<div class="stat"><b>'+esc(s[0])+'</b><span>'+s[1]+'</span>'+(s[2]?'<em>'+esc(s[2])+'</em>':'')+'</div>';
  }).join("")+'</div>';
}
function factStrip(a){
  if(!a||!a.length) return "";
  return '<dl class="facts">'+a.map(function(f){
    return '<div><dt>'+esc(f[0])+'</dt><dd>'+f[1]+'</dd></div>';
  }).join("")+'</dl>';
}
function sections(a){
  if(!a||!a.length) return "";
  return a.map(function(s){
    return '<h4 class="sec">'+esc(s.h)+'</h4><ul>'+s.ul.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ul>';
  }).join("");
}
function timeline(a){
  if(!a||!a.length) return "";
  return '<ul class="tl">'+a.map(function(t){
    return '<li>'+(t[0]?'<span class="yr">'+t[0]+'</span>':'')+'<span class="ev">'+t[1]+'</span></li>';
  }).join("")+'</ul>';
}
function linkList(a){
  if(!a||!a.length) return "";
  return '<ul class="links">'+a.map(function(l){
    return '<li><a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+
      (l[2]?'<span class="h">'+esc(l[2])+'</span>':'')+'</a></li>';
  }).join("")+'</ul>';
}
function roster(a){
  if(!a||!a.length) return "";
  return '<div class="roster">'+a.map(function(r){
    return '<div class="rost"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>';
  }).join("")+'</div>';
}
function memoBlock(m){
  if(!m) return "";
  var inner = m.raw
    ? '<div class="exact">'+m.raw.map(esc).join("\n")+'</div>'
    : (m.body||[]).map(function(p){return "<p>"+p+"</p>";}).join("");
  return '<details class="memo"><summary>'+esc(m.label)+'</summary><div class="m">'+inner+'</div></details>';
}
function docViewer(d){
  if(!d) return "";
  return '<div class="doc"><div class="dh"><span>'+esc(d.label)+'</span>'+
    '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">Open in new tab</a></div>'+
    '<iframe src="'+esc(d.url)+'#view=FitH" title="'+esc(d.label)+'" loading="lazy"></iframe></div>';
}
function ideaList(a){
  if(!a||!a.length) return "";
  return a.map(function(i){
    return '<div class="idea'+(i.p?' p1':'')+'"><h5>'+esc(i.t)+'</h5><p>'+i.d+'</p>'+
      (i.q?'<p class="q">Open: '+i.q+'</p>':'')+'</div>';
  }).join("");
}

/* ---------- views ---------- */

function renderAgenda(){
  var real = MEETINGS.filter(function(m){return !m.placeholder;});
  var blanks = MEETINGS.length - real.length;
  var order = [], groups = {};
  real.forEach(function(m){
    var d = m.day || "Date to be confirmed";
    if(!groups[d]){ groups[d] = []; order.push(d); }
    groups[d].push(m);
  });
  var h = "";
  order.forEach(function(d){
    h += '<div class="dayhead"><h2>'+esc(d)+'</h2><span>'+groups[d].length+
         (groups[d].length===1?' meeting':' meetings')+'</span></div>';
    groups[d].forEach(function(m){
      h += '<button class="card" data-open="'+m.id+'" style="border-left-color:'+m.accent+'">'+
        '<span class="mono" style="background:'+m.accent+'">'+esc(m.mono)+'</span>'+
        '<span class="tm">'+esc(m.time)+'</span>'+
        '<span class="body"><h3>'+esc(m.org)+'</h3>'+
        '<p class="sub">'+esc(m.contactName)+' \u00b7 '+esc(m.contactRole)+'</p></span>'+
        '<span class="go">Open</span></button>';
    });
  });
  if(blanks){
    h += '<div class="dayhead"><h2>To come</h2><span>'+blanks+' slots</span></div>';
    for(var i=0;i<blanks;i++){ h += '<div class="slot">Held for a meeting still to be added.</div>'; }
  }
  el("agenda").innerHTML = h;
  el("foot").textContent = "Open-source research as of 19 September 2026. Figures should be verified against primary sources before external use.";
}

var TABS = [["overview","Overview"],["contact","Contact"],["org","Organization"],["history","Gallup history"],["ideas","Ideas"]];
function tabsFor(m){
  return TABS.map(function(t){
    return t[0]==="ideas" && m.ideasLabel ? ["ideas", m.ideasLabel] : t;
  });
}

function paneHTML(m,key){
  if(key==="overview"){
    var o = m.overview;
    return '<p class="lede">'+o.lede+'</p>'+factStrip(o.facts)+
      sections(o.sections)+
      (o.memos && o.memos.length ? o.memos.map(memoBlock).join("") : '')+
      (o.stats && o.stats.length ? '<h4 class="sec">Relevant insights</h4>'+statTiles(o.stats) : '')+
      (o.pages && o.pages.length ? '<h4 class="sec">Relevant pages</h4>'+linkList(o.pages) : '');
  }
  if(key==="contact"){
    var c = m.contact;
    return '<div class="person"><span class="mono">'+esc(m.contactMono)+'</span>'+
      '<span><h5>'+esc(m.contactName)+'</h5><p class="role">'+esc(m.contactRole)+
      (m.contactName.indexOf("confirm")<0 ? " — "+esc(m.org) : "")+'</p></span></div>'+
      '<ul>'+c.bullets.map(function(b){return "<li>"+b+"</li>";}).join("")+'</ul>'+
      (c.timeline.length ? '<h4 class="sec">Career</h4>'+timeline(c.timeline) : '')+
      (c.also ? c.also.map(function(p){
        return '<h4 class="sec">'+esc(p.head||"Also joining")+'</h4>'+
          '<div class="person"><span class="mono">'+esc(p.mono)+'</span>'+
          '<span><h5>'+esc(p.name)+'</h5><p class="role">'+esc(p.role)+'</p></span></div>'+
          '<ul>'+p.bullets.map(function(b){return "<li>"+b+"</li>";}).join("")+'</ul>'+
          (p.timeline && p.timeline.length ? timeline(p.timeline) : '');
      }).join("") : '')+
      (c.sections ? sections(c.sections) : '')+
      (c.note ? '<h4 class="sec">Note</h4><p>'+c.note+'</p>' : '')+
      (c.roster && c.roster.length ? '<h4 class="sec">Others on that side</h4>'+roster(c.roster) : '')+
      (c.links.length ? '<h4 class="sec">Links</h4>'+linkList(c.links) : '');
  }
  if(key==="org"){
    var g = m.orgIntel;
    return '<p class="lede">'+g.lede+'</p>'+statTiles(g.stats)+sections(g.sections)+
      '<h4 class="sec">People</h4>'+roster(g.roster)+
      '<h4 class="sec">Links</h4>'+linkList(g.links);
  }
  if(key==="history"){
    var y = m.history;
    return '<p class="lede">'+y.lede+'</p>'+
      (y.timeline.length ? timeline(y.timeline) : '')+
      (y.note ? '<h4 class="sec">Note</h4><p>'+y.note+'</p>' : '')+
      (y.docs && y.docs.length ? '<h4 class="sec">Documents</h4>'+y.docs.map(docViewer).join("") : '')+
      sections(y.sections)+
      (y.links.length ? '<h4 class="sec">Links</h4>'+linkList(y.links) : '');
  }
  return (m.ideasNote ? '<p class="lede">'+m.ideasNote+'</p>' : '') + ideaList(m.ideas);
}

var current = null;

function openMeeting(id){
  var m = MEETINGS.filter(function(x){return x.id===id;})[0];
  if(!m || m.placeholder) return;
  current = m;
  document.documentElement.style.setProperty("--accent", m.accent);
  el("detail").innerHTML =
    '<button class="back" id="back">&larr; All meetings</button>'+
    '<div class="mhead"><span class="mono" style="background:'+m.accent+'">'+esc(m.mono)+'</span>'+
    '<span><h2>'+esc(m.org)+'</h2><p>'+esc([m.day,m.time,m.contactName].filter(Boolean).join(" \u00b7 "))+'</p></span></div>'+
    '<div class="tabs" role="tablist">'+tabsFor(m).map(function(t,i){
      return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(i===0)+'">'+t[1]+'</button>';
    }).join("")+'</div><div class="pane" id="pane"></div>';
  el("agenda").classList.add("hide");
  el("detail").classList.remove("hide");
  showTab("overview");
  window.scrollTo(0,0);
}

function showTab(key){
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", t.getAttribute("data-tab")===key ? "true" : "false");
  });
  el("pane").innerHTML = paneHTML(current, key);
}

function closeMeeting(){
  current = null;
  el("detail").classList.add("hide");
  el("agenda").classList.remove("hide");
  document.documentElement.style.setProperty("--accent","#2f6b58");
  window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var o = e.target.closest ? e.target.closest("[data-open]") : null;
  if(o){ openMeeting(o.getAttribute("data-open")); return; }
  if(e.target.id==="back"){ closeMeeting(); return; }
  var tb = e.target.closest ? e.target.closest(".tab") : null;
  if(tb){ showTab(tb.getAttribute("data-tab")); }
});

el("prt").addEventListener("click",function(){window.print();});

renderAgenda();

})();
</script>
</body>
</html>
